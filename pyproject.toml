[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msaccess-vcs-mcp"
version = "0.2.0"
description = "MCP server for Microsoft Access database version control"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Adam Waller"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp[cli]>=1.28,<2",
    "python-dotenv>=1.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/joyfullservice/msaccess-vcs-mcp"
Repository = "https://github.com/joyfullservice/msaccess-vcs-mcp"
Issues = "https://github.com/joyfullservice/msaccess-vcs-mcp/issues"

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "twine>=5.0.0",
]

[project.scripts]
msaccess-vcs-mcp = "msaccess_vcs_mcp.main:main"
msaccess-vcs = "msaccess_vcs_mcp.cli:main"

[tool.uv]
# Relative exclude-newer durations need uv 0.9.17+; older versions ignore these settings.
required-version = ">=0.9.17"
# Supply-chain cooldown for lock resolution; matches the Dependabot cooldown.
exclude-newer = "3 days"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
msaccess_vcs_mcp = [".env.example", "tips/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "integration: marks tests as integration tests (require Access installed)",
    "concurrency: multi-instance Access suite; skipped unless pytest runs with --run-concurrency",
]
